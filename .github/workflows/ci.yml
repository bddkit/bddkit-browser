name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned on purpose: a floating stable's new clippy lint must never
      # redden a PR that has nothing to do with it.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
          rustflags: ""
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked --lib --test stub

  e2e-chrome:
    name: e2e against a Chrome container
    runs-on: ubuntu-latest
    # `checks: write` is for the example report below, published as a Check Run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          rustflags: ""
      # The host comes from crates.io at a pinned version, never a floating
      # branch: a red run here must mean this plugin broke. 0.2.0 is the
      # first release that reads `fields` and resolves `bddkit_probe_config`.
      - name: Install bddkit
        run: cargo install bddkit --version 0.3.0 --locked
      - name: Start Chrome
        run: docker compose up -d --wait
      - name: End-to-end
        run: cargo test --locked --test e2e -- --test-threads=1 --nocapture
      # The documented path, verbatim from examples/README.md: the lock in
      # examples/.bddkit points at target/release, the site is the example
      # binary on :3000, the config is examples/browser.yaml itself.
      - name: Examples, the documented way
        run: |
          cargo build --locked --release
          cargo run --locked --quiet --example site &
          site=$!
          trap 'kill $site' EXIT
          timeout 60 sh -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 1; done'
          bddkit run --config examples/browser.yaml --junit "$RUNNER_TEMP/reports/browser.xml"
      # `always()`: a red run is exactly when the report is wanted. A PR from
      # a fork gets a read-only token and cannot create the Check Run.
      - name: Example report
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@v2
        with:
          name: Examples (Chrome)
          path: ${{ runner.temp }}/reports/*.xml
          reporter: java-junit

  e2e-firefox-managed:
    name: e2e on a managed Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          rustflags: ""
      - name: Install bddkit
        run: cargo install bddkit --version 0.3.0 --locked
      # The real release asset names are linux-x86_64 / linux-arm64 / macos /
      # windows.exe, never a bare "-linux" — check the artifact list before
      # touching this if it ever needs a second platform.
      - name: Fetch Selenium Manager
        run: |
          curl -fsSL -o /usr/local/bin/selenium-manager \
            https://github.com/SeleniumHQ/selenium_manager_artifacts/releases/latest/download/selenium-manager-linux-x86_64
          chmod +x /usr/local/bin/selenium-manager
          selenium-manager --version
      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/bddkit/plugins/browser
          key: managed-firefox-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: End-to-end (managed)
        env:
          BDDKIT_BROWSER_MANAGED: "1"
        run: cargo test --locked --test e2e the_examples_pass_on_a_managed_firefox -- --nocapture
