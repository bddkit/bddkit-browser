[package]
name = "bddkit-browser"
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
description = "Browser steps for the bddkit acceptance-testing tool: a real browser over WebDriver and BiDi"
license = "Apache-2.0"
repository = "https://github.com/bddkit/bddkit-browser"
homepage = "https://github.com/bddkit/bddkit-browser"
readme = "README.md"
keywords = ["bdd", "gherkin", "testing", "webdriver", "bddkit"]
categories = ["development-tools::testing"]
exclude = ["/.github", "/.idea", "/docker-compose.yml", "/docs"]

[lib]
# rlib beside the cdylib so `tests/stub/` can call the exports in-process.
crate-type = ["cdylib", "rlib"]

[[example]]
name = "site"
path = "examples/site/main.rs"

[dependencies]
# Blocking on purpose: the host calls every export under spawn_blocking, and a
# tokio runtime inside a cdylib that is never unloaded has no owner.
ureq = { version = "3.4", features = ["json"] }
tungstenite = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
url = "2"
libc = "0.2"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
clone_on_ref_ptr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# noise for this project
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
format_push_string = "allow"
